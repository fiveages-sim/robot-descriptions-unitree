controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - Left_Wheel_joint
      - Right_Wheel_joint
      - lift_stage1_joint
      - lift_stage2_joint
      - front_left_caster_Yaw_joint
      - front_left_caster_Roll_joint
      - front_right_caster_Yaw_joint
      - front_right_caster_Roll_joint
      - rear_left_caster_Yaw_joint
      - rear_left_caster_Roll_joint
      - rear_right_caster_Yaw_joint
      - rear_right_caster_Roll_joint
      - waist_yaw_joint
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint
      - head_pitch_joint
      - head_yaw_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
