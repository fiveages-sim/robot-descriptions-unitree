# Hardware overlay, automatically merged when hardware:=isaac.
ocs2_arm_controller:
  ros__parameters:
    command_interfaces: [position]
    state_interfaces: [position, velocity, effort]
    # Isaac plans both arms only (14 joints); all waist joints are fixed in OCS2.
    # The base task.info keeps the entire waist fixed.
    info_file_name: isaac_waist
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint
    # Joint order must match `joints` above: left arm, then right arm.
    home_pos: [
      0.0, 0.2, 0.0, 0.0, -0.2, 0.0, 0.0,
      0.0, -0.2, 0.0, 0.0, 0.2, 0.0, 0.0 ]
    rest_pos: [
      0.0, 0.2, 0.0, 1.57, 0.0, 0.0, 0.0,
      0.0, -0.2, 0.0, 1.57, 0.0, 0.0, 0.0 ]

# Controller types are registered by end-effector composition (type:=dex1).
# Keep the original closing target even when the force threshold is triggered.
left_gripper_controller:
  ros__parameters:
    joint: left_gripper_joint
    use_effort_interface: false
    force_feedback_ratio: 1.0

right_gripper_controller:
  ros__parameters:
    joint: right_gripper_joint
    use_effort_interface: false
    force_feedback_ratio: 1.0
