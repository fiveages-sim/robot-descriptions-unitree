/**:
  ros__parameters:
    linear_scale: 0.3
    angular_scale: 0.5
    enable_vr: true

    # split_body / fixed-base: markers in base_footprint.
    # full_body + WBC: launch overrides marker_fixed_frame to world
    # (RViz Fixed Frame=world from config/rviz/fullbody.rviz).
    marker_fixed_frame: base_footprint
    vr_follow_frame: base_footprint
    enable_wbc_head_tracking_marker: false

    head_link_name: "head_link"
    reference_link: "head_link"
