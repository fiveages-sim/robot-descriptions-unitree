/**:
  ros__parameters:
    linear_scale: 0.3
    angular_scale: 0.5
    enable_vr: true

    # split_body / fixed-base: markers in base_footprint.
    # full_body + mobile (modelType 1): launch + parse_task_info override
    # marker_fixed_frame and control_base_frame to world (OCS2 EE targets are world).
    # Keep vr_follow_frame on footprint so VR stays chassis-relative before convert-to-world.
    marker_fixed_frame: base_footprint
    vr_follow_frame: base_footprint
    enable_wbc_head_tracking_marker: false

    head_link_name: "head_link"
    reference_link: "head_link"
